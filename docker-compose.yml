services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 3000
      LAUNCHER_REGISTRATION_KEY: ${LAUNCHER_REGISTRATION_KEY:-change-me-in-production}
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
